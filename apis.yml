aid: mythical-games
name: Mythical Games
description: >-
  Mythical Games is a Web3 game-technology studio and platform company (an a16z
  portfolio company) that builds games with player-owned digital items and a
  secondary marketplace economy. Its business has two sides: consumer game titles
  (FIFA Rivals, Pudgy Party, Blankos) and the Mythical Platform, a B2B toolkit that
  lets any game add a secondary economy of tradeable items and currencies. The
  platform is exposed to integrating studios primarily through gRPC/Protobuf SDKs —
  the Saga SDK and the earlier IVI SDK — published for Java, C++, and Python, rather
  than a public REST/OpenAPI surface. The Saga gRPC API covers items, item types,
  currencies, currency types, listings, offers, player wallets, reservations, an NFT
  bridge, and metadata, with cursor-based queries and a server-streaming status
  channel for confirming asynchronous writes. Assets settle on the Mythos chain, a
  Polkadot/Substrate gaming parachain (MYTH token) whose node software is open source.
