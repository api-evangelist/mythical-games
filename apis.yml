apis:
- name: Mythical Saga Platform API
  description: >-
    gRPC/Protobuf API of the Mythical Platform (Saga SDK) for issuing, transferring,
    and burning game items and currencies, managing item/currency types and minting,
    creating marketplace listings and offers, provisioning player wallets, reserving
    inventory, bridging items to NFTs, and updating item metadata. Asynchronous writes
    return a trace_id (ReceivedResponse) and are confirmed over a server-streaming
    StatusStream channel.
  humanURL: https://github.com/MythicalGames/saga-sdk-proto
